name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: patient-service/pom.xml

      # Testcontainers-backed tests need a Docker daemon; ubuntu-latest provides one.
      - name: Build and test
        working-directory: patient-service
        run: mvn -B verify

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # --log-opts=--all only sees one commit on the default shallow clone.
          fetch-depth: 0

      # Same image and arguments as the local verification run.
      # gitleaks exits non-zero on any finding, which fails the job.
      - name: Scan full git history for secrets
        run: |
          docker run --rm -v "$PWD:/repo" \
            zricethezav/gitleaks:v8.30.1 \
            detect --source /repo --log-opts=--all --verbose --no-banner
