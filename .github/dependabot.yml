version: 2

updates:
  # The root aggregator POM lists every module, so Dependabot follows them from "/".
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  # The Postgres image pin lives in docker-compose.yml. The "docker" ecosystem
  # only reads Dockerfiles, of which this repo has none; "docker-compose" is the
  # one that tracks compose image tags.
  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "weekly"
