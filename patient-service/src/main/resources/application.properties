spring.application.name=patient-service

# --- Credentials ---
# Spring does not read .env natively; import the root .env as a property source.
# Real environment variables still win over these values.
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]

# --- Database Configuration ---
spring.datasource.url=jdbc:postgresql://localhost:5432/patient_db
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}
# Keep row values out of exception messages and therefore logs: by default PgJDBC appends the
# server's error detail, e.g. "Key (email)=(...) already exists" or "Failing row contains (...)".
spring.datasource.hikari.data-source-properties[logServerErrorDetail]=false
# Seconds. A statement on a connection whose server stopped answering fails instead of holding a
# request thread and a pooled connection forever.
spring.datasource.hikari.data-source-properties[socketTimeout]=30
# Seconds to open a TCP connection to the database: the driver's default, made explicit.
spring.datasource.hikari.data-source-properties[connectTimeout]=10

# --- JPA / Hibernate ---
# Flyway owns the schema; Hibernate only checks the entities match it.
spring.jpa.hibernate.ddl-auto=validate
# No lazy loading during view rendering: persistence work stays inside the service layer.
spring.jpa.open-in-view=false

# --- Schema migrations (Flyway, classpath:db/migration) ---
# Baselining is deliberately off: startup fails on a non-empty database that has no Flyway
# history, instead of silently marking V1 as applied without checking the schema.
#
# ONE-TIME step for a local patient_db created by the old data.sql script (it has the
# patients table but no flyway_schema_history). Run the app once with baselining enabled,
# from the repository root:
#   mvn -B -pl patient-service -am package -DskipTests
#   java -jar patient-service/target/patient-service-0.0.1-SNAPSHOT.jar --spring.flyway.baseline-on-migrate=true --spring.flyway.baseline-version=1
# or, with the common module already installed (mvn -B -pl common install):
#   mvn -pl patient-service spring-boot:run "-Dspring-boot.run.arguments=--spring.flyway.baseline-on-migrate=true --spring.flyway.baseline-version=1"
# That run records V1 as the baseline. The history table then exists, so later runs need no
# flags. Fresh databases (Testcontainers, CI) are empty and run V1 normally.

# --- Pagination (GET /api/v1/patients?page=&size=&sort=) ---
spring.data.web.pageable.default-page-size=20
# Larger requested sizes are capped to this value, not rejected.
spring.data.web.pageable.max-page-size=100
# Serialize any Page as Spring Data's stable {content, page{...}} DTO shape (default: direct).
spring.data.web.pageable.serialization-mode=via-dto

# --- Kafka: patient.created events (contract: PROJECT_BRIEF.md "Kafka Event Contract") ---
# Not secret: the local compose broker's external listener. Override with KAFKA_BOOTSTRAP_SERVERS.
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:19092}
# Payloads are JSON strings built by the service itself, so no Java type headers are sent.
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
# Every in-sync replica must have the record, and producer retries cannot write it twice.
spring.kafka.producer.acks=all
spring.kafka.producer.properties[enable.idempotence]=true
# Events are sent one at a time from a single background thread. Kafka's defaults would block each
# send for up to 60 s (max.block.ms) while the broker is unreachable, stalling every event queued
# behind it, and keep retrying a send for 120 s (delivery.timeout.ms). Bounds instead:
# - max.block.ms: longest send() may block the sender thread waiting for broker metadata.
spring.kafka.producer.properties[max.block.ms]=2000
# - request.timeout.ms: longest wait for the broker to answer one produce request.
spring.kafka.producer.properties[request.timeout.ms]=5000
# - delivery.timeout.ms: total time to deliver a record, retries included, before it is reported
#   failed. Kafka requires it to be >= linger.ms + request.timeout.ms.
spring.kafka.producer.properties[delivery.timeout.ms]=10000
# The topic is created once at startup if missing (KafkaAdmin, see PatientEventsConfig). The 30 s
# default operation timeout would stall startup that long while the broker is unreachable.
spring.kafka.admin.operation-timeout=5s
pms.events.patient-created.topic=patient.created
pms.events.patient-created.partitions=${PATIENT_CREATED_PARTITIONS:3}
# 1 suits the single local broker; a multi-broker cluster needs more.
pms.events.patient-created.replicas=${PATIENT_CREATED_REPLICAS:1}
# Sends run on one background thread so the request thread (and its pooled DB connection) never
# waits on Kafka. Committed events wait in a bounded queue; when it is full an event is dropped,
# logged and counted. On shutdown, queued events get drain-timeout (>= delivery.timeout.ms) to go.
pms.events.publisher.queue-capacity=1000
pms.events.publisher.drain-timeout=15s

# --- Actuator: health only, with liveness/readiness probes ---
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
# /actuator/health/liveness and /actuator/health/readiness
management.endpoint.health.probes.enabled=true
# Not ready to take traffic while the database is unreachable. Kafka is deliberately not part of
# readiness: patients can still be created while the broker is down (the event is then lost and
# the failure logged and counted, see PIPELINE.md).
management.endpoint.health.group.readiness.include=readinessState,db

# --- Logging ---
# One ECS JSON object per line on stdout; MDC entries such as correlationId are included.
logging.structured.format.console=ecs
logging.level.root=info

server.port=4000
# Loopback by default: reachable only from this machine, never from the LAN. This service trusts
# the gateway's identity headers, so direct local access bypasses the gateway (an accepted V1 dev
# trade-off; real isolation comes from AWS networking). Override with SERVER_ADDRESS if needed.
server.address=${SERVER_ADDRESS:127.0.0.1}
