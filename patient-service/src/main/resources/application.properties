spring.application.name=patient-service

# --- Credentials ---
# Spring does not read .env natively; import the root .env as a property source.
# Real environment variables still win over these values.
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]

# --- Database Configuration ---
spring.datasource.url=jdbc:postgresql://localhost:5432/patient_db
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}

# --- Hibernate Settings ---
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# --- Schema migrations (Flyway, classpath:db/migration) ---
# Existing local patient_db databases already contain the patients table, created by the
# old data.sql script, but no Flyway history. Baselining at version 1 records V1 as already
# applied there instead of re-running it. Fresh databases (Testcontainers, CI) have an empty
# schema, so Flyway ignores the baseline settings and runs V1 normally.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

logging.level.org.springframework.security=DEBUG

# --- Pagination (GET /api/v1/patients?page=&size=&sort=) ---
spring.data.web.pageable.default-page-size=20
# Larger requested sizes are capped to this value, not rejected.
spring.data.web.pageable.max-page-size=100
# Serialize any Page as Spring Data's stable {content, page{...}} DTO shape (default: direct).
spring.data.web.pageable.serialization-mode=via-dto

server.port=4000

logging.level.root=info