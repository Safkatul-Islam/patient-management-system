spring.application.name=patient-service

# --- Credentials ---
# Spring does not read .env natively; import the root .env as a property source.
# Real environment variables still win over these values.
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]

# --- Database Configuration ---
spring.datasource.url=jdbc:postgresql://localhost:5432/patient_db
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}

# --- JPA / Hibernate ---
# Flyway owns the schema; Hibernate only checks the entities match it.
spring.jpa.hibernate.ddl-auto=validate
# No lazy loading during view rendering: persistence work stays inside the service layer.
spring.jpa.open-in-view=false

# --- Schema migrations (Flyway, classpath:db/migration) ---
# Baselining is deliberately off: startup fails on a non-empty database that has no Flyway
# history, instead of silently marking V1 as applied without checking the schema.
#
# ONE-TIME step for a local patient_db created by the old data.sql script (it has the
# patients table but no flyway_schema_history). Run the app once with baselining enabled,
# from the repository root:
#   mvn -B -pl patient-service -am package -DskipTests
#   java -jar patient-service/target/patient-service-0.0.1-SNAPSHOT.jar --spring.flyway.baseline-on-migrate=true --spring.flyway.baseline-version=1
# or, with the common module already installed (mvn -B -pl common install):
#   mvn -pl patient-service spring-boot:run "-Dspring-boot.run.arguments=--spring.flyway.baseline-on-migrate=true --spring.flyway.baseline-version=1"
# That run records V1 as the baseline. The history table then exists, so later runs need no
# flags. Fresh databases (Testcontainers, CI) are empty and run V1 normally.

# --- Pagination (GET /api/v1/patients?page=&size=&sort=) ---
spring.data.web.pageable.default-page-size=20
# Larger requested sizes are capped to this value, not rejected.
spring.data.web.pageable.max-page-size=100
# Serialize any Page as Spring Data's stable {content, page{...}} DTO shape (default: direct).
spring.data.web.pageable.serialization-mode=via-dto

# --- Actuator: health only, with liveness/readiness probes ---
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
# /actuator/health/liveness and /actuator/health/readiness
management.endpoint.health.probes.enabled=true
# Not ready to take traffic while the database is unreachable.
management.endpoint.health.group.readiness.include=readinessState,db

# --- Logging ---
# One ECS JSON object per line on stdout; MDC entries such as correlationId are included.
logging.structured.format.console=ecs
logging.level.root=info

server.port=4000
