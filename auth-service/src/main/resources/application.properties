spring.application.name=auth-service

server.port=4005

# --- Credentials ---
# Spring does not read .env natively; import the root .env as a property source.
# Real environment variables still win over these values.
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]

# --- Database Configuration ---
spring.datasource.url=jdbc:postgresql://localhost:5432/auth_db
spring.datasource.username=${AUTH_DB_USER}
spring.datasource.password=${AUTH_DB_PASSWORD}

# --- Hibernate Settings ---
# Flyway owns the schema (src/main/resources/db/migration); Hibernate only checks it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# --- Access tokens (RS256 JWT) ---
# Issuer and audience are not secret. The signing key and its id come only from the
# environment; an empty value fails startup.
pms.auth.jwt.issuer=http://auth-service:4005
pms.auth.jwt.audience=pms-api
pms.auth.jwt.key-id=${AUTH_JWT_KEY_ID:}
pms.auth.jwt.private-key=${AUTH_JWT_PRIVATE_KEY:}
pms.auth.jwt.access-token-ttl=15m

# --- Refresh tokens (opaque, rotated on every use) ---
pms.auth.refresh-token.ttl=7d

# --- First ADMIN account (optional; created only while no ADMIN exists) ---
pms.auth.bootstrap-admin.email=${AUTH_BOOTSTRAP_ADMIN_EMAIL:}
pms.auth.bootstrap-admin.password=${AUTH_BOOTSTRAP_ADMIN_PASSWORD:}

# --- Logging ---
# Structured JSON on the console. Never log tokens, passwords, hashes or emails.
logging.structured.format.console=ecs

# --- Actuator ---
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db
management.endpoint.health.show-details=never
