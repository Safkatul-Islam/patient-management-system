spring.application.name=api-gateway

server.port=4004
# Loopback by default for local development; a container sets SERVER_ADDRESS=0.0.0.0.
server.address=${SERVER_ADDRESS:127.0.0.1}
# Never derive the client address, scheme or host from client-supplied Forwarded /
# X-Forwarded-* headers. Left unset, Boot deduces this from the cloud platform (e.g. it
# would trust them on Kubernetes). Revisit only behind a known load balancer.
server.forward-headers-strategy=none

# The gateway holds no secrets, so unlike the services it does not import the root .env
# (which contains other services' credentials). Override the URIs with environment variables.

# --- Downstream services (scheme, host and port; paths are forwarded unchanged) ---
pms.gateway.auth-service-uri=${AUTH_SERVICE_URI:http://localhost:4005}
pms.gateway.patient-service-uri=${PATIENT_SERVICE_URI:http://localhost:4000}

# --- Access-token verification (RS256, keys from auth-service's JWK set) ---
pms.gateway.jwt.issuer=http://auth-service:4005
pms.gateway.jwt.audience=pms-api
pms.gateway.jwt.jwks.uri=${pms.gateway.auth-service-uri}/.well-known/jwks.json
# Unknown key ids trigger at most one JWK set fetch per cooldown.
pms.gateway.jwt.jwks.cooldown=30s
pms.gateway.jwt.jwks.connect-timeout=2s
pms.gateway.jwt.jwks.response-timeout=3s
pms.gateway.jwt.jwks.max-size=64KB

# --- Proxying (routes are defined in RouteConfig) ---
# Milliseconds (the property is an Integer).
spring.cloud.gateway.server.webflux.httpclient.connect-timeout=2000
spring.cloud.gateway.server.webflux.httpclient.response-timeout=5s
# Client-supplied Forwarded / X-Forwarded-* headers are removed, not forwarded. With
# trusted-proxies unset this is already the 5.0.x behaviour (the Remove*HeadersFilter beans
# replace the Forwarded/XForwarded filters); disabling both filters keeps it that way even if
# trusted-proxies is set later without revisiting this decision.
spring.cloud.gateway.server.webflux.x-forwarded.enabled=false
spring.cloud.gateway.server.webflux.forwarded.enabled=false

# --- Reactor: carry the correlation ID from the Reactor context into the MDC (logs) ---
spring.reactor.context-propagation=auto

# --- Logging ---
# Structured JSON on the console. Never log tokens, Authorization headers or request bodies.
logging.structured.format.console=ecs

# --- Actuator: health only, with liveness/readiness probes ---
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
# Downstream services are deliberately not part of readiness: their outage must not take
# the gateway out of rotation (no cascading failure); the gateway answers 503 instead.
management.endpoint.health.group.readiness.include=readinessState
