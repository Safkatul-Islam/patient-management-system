spring.application.name=analytics-service

# Loopback by default: reachable only from this machine, never the LAN. Override with
# SERVER_ADDRESS (e.g. 0.0.0.0) when running in a container.
server.address=${SERVER_ADDRESS:127.0.0.1}
server.port=4011

# --- Credentials ---
# Spring does not read .env natively; import the root .env as a property source.
# Real environment variables still win over these values.
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]

# --- Database (analytics_db, owned by this service only) ---
spring.datasource.url=jdbc:postgresql://localhost:5432/analytics_db
spring.datasource.username=${ANALYTICS_DB_USER}
spring.datasource.password=${ANALYTICS_DB_PASSWORD}
# Keep the driver's server error detail (which can quote row values) out of exceptions and logs.
spring.datasource.hikari.data-source-properties[logServerErrorDetail]=false
# Seconds. A statement on a connection whose server stopped answering fails instead of blocking
# the Kafka consumer thread forever; the error handler then backs off and retries.
spring.datasource.hikari.data-source-properties[socketTimeout]=30
# Seconds to open a TCP connection to the database: the driver's default, made explicit.
spring.datasource.hikari.data-source-properties[connectTimeout]=10

# Flyway owns the schema; Hibernate only checks the entities match it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# --- Kafka (Redpanda locally) ---
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:19092}
# Its own consumer group: independent of every other consumer of the same topic.
spring.kafka.consumer.group-id=analytics-service
# A new group starts from the oldest retained event instead of skipping what was published before
# it first connected.
spring.kafka.consumer.auto-offset-reset=earliest
# Offsets are committed by the listener container after processing, never on a timer.
spring.kafka.consumer.enable-auto-commit=false
# Plain JSON strings: the payload is parsed by this service's own tolerant reader.
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
# Never create patient.created by subscribing to it: the producer owns its partition count.
spring.kafka.consumer.properties[allow.auto.create.topics]=false
# The producer is used only to publish dead letters: the original key and value bytes, as strings.
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
# Bounded, so a dead-letter publish to an unreachable broker fails (and the record is retried)
# instead of blocking the consumer. delivery.timeout.ms must be >= request.timeout.ms + linger.ms.
spring.kafka.producer.properties[max.block.ms]=5000
spring.kafka.producer.properties[request.timeout.ms]=5000
spring.kafka.producer.properties[delivery.timeout.ms]=10000

# --- Events ---
pms.events.patient-created.topic=patient.created
# This consumer group's own dead-letter topic (patient.created.<consumer>.dlt).
pms.events.patient-created.dead-letter-topic=patient.created.analytics-service.dlt

# --- Actuator: health only, with liveness/readiness probes ---
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
# Not ready while its own database is unreachable.
management.endpoint.health.group.readiness.include=readinessState,db

# --- Logging ---
# One ECS JSON object per line on stdout; MDC entries such as correlationId are included.
logging.structured.format.console=ecs
logging.level.root=info
