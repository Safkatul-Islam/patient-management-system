spring.application.name=notification-service

# Loopback by default: reachable only from this machine, never the LAN. Override with
# SERVER_ADDRESS (e.g. 0.0.0.0) when running in a container.
server.address=${SERVER_ADDRESS:127.0.0.1}
server.port=4010

# --- Credentials ---
# Spring does not read .env natively; import the root .env as a property source.
# Real environment variables still win over these values.
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]

# --- Database (notification_db, owned by this service only) ---
spring.datasource.url=jdbc:postgresql://localhost:5432/notification_db
spring.datasource.username=${NOTIFICATION_DB_USER}
spring.datasource.password=${NOTIFICATION_DB_PASSWORD}
# Keep the driver's server error detail (which can quote row values) out of exceptions and logs.
spring.datasource.hikari.data-source-properties[logServerErrorDetail]=false

# Flyway owns the schema; Hibernate only checks the entities match it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# --- Kafka (Redpanda locally) ---
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:19092}
# Its own consumer group: independent of every other consumer of the same topic.
spring.kafka.consumer.group-id=notification-service
# A new group starts from the oldest retained event instead of skipping what was published before
# it first connected.
spring.kafka.consumer.auto-offset-reset=earliest
# Offsets are committed by the listener container after processing, never on a timer.
spring.kafka.consumer.enable-auto-commit=false
# Plain JSON strings: the payload is parsed by this service's own tolerant reader.
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
# The producer owns patient.created and its partition count; subscribing must never create it
# with the broker's defaults.
spring.kafka.consumer.properties[allow.auto.create.topics]=false

# Producer: used only to publish failed records to the dead-letter topic, unchanged. Strings in,
# strings out, so the dead-lettered value is byte-for-byte what was consumed.
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
# Bounded: a send blocks at most max.block.ms for metadata and fails after delivery.timeout.ms
# (which must be >= linger.ms + request.timeout.ms) instead of the client's 1-2 minute defaults.
spring.kafka.producer.properties[max.block.ms]=5000
spring.kafka.producer.properties[request.timeout.ms]=5000
spring.kafka.producer.properties[delivery.timeout.ms]=10000

# --- patient.created consumption ---
pms.events.patient-created.topic=patient.created
# This consumer group's own dead-letter topic (patient.created.<consumer>.dlt). At least as many
# partitions as patient.created (3): dead-lettered records keep their source partition number.
pms.events.patient-created.dead-letter-topic=patient.created.notification-service.dlt
pms.events.patient-created.dead-letter-partitions=3
# Retryable failures: 1 attempt + 2 retries, 1 s apart, then the dead-letter topic.
pms.events.patient-created.retry-interval=1s
pms.events.patient-created.max-retries=2

# --- Actuator: health only, with liveness/readiness probes ---
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
# Not ready while its own database is unreachable.
management.endpoint.health.group.readiness.include=readinessState,db

# --- Logging ---
# One ECS JSON object per line on stdout; MDC entries such as correlationId are included.
logging.structured.format.console=ecs
logging.level.root=info
