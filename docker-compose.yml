services:
  postgres:
    image: postgres:17.5
    container_name: pms-postgres
    environment:
      POSTGRES_DB: patient_db
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # Read by the docker/postgres/init scripts to create each service's own role
      # and database (auth_db, notification_db, analytics_db) next to patient_db.
      AUTH_DB_USER: ${AUTH_DB_USER}
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD}
      NOTIFICATION_DB_USER: ${NOTIFICATION_DB_USER}
      NOTIFICATION_DB_PASSWORD: ${NOTIFICATION_DB_PASSWORD}
      ANALYTICS_DB_USER: ${ANALYTICS_DB_USER}
      ANALYTICS_DB_PASSWORD: ${ANALYTICS_DB_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - patient-db-data:/var/lib/postgresql/data
      # Init scripts run only when the data volume is empty (first start).
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d patient_db"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  # Kafka-API-compatible broker for local development: a single node in dev-container mode.
  # Services on the host connect to 127.0.0.1:19092; the internal listener is for containers.
  redpanda:
    image: redpandadata/redpanda:v26.2.5
    container_name: pms-redpanda
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --smp=1
      - --memory=1G
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:19092
      # Topics are created only by the service that owns them (patient-service declares
      # patient.created with 3 partitions), never implicitly by a first produce or fetch with the
      # broker's default partition count. This flag applies only when the cluster is first created;
      # for an existing redpanda-data volume, run once:
      #   docker exec pms-redpanda rpk cluster config set auto_create_topics_enabled false
      # rpk only accepts "--set <key>=<value>" as two arguments; "--set=..." is passed through to the
      # broker binary, which rejects it and the container restarts in a loop.
      - --set
      - redpanda.auto_create_topics_enabled=false
    ports:
      - "127.0.0.1:19092:19092"
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster info -X brokers=localhost:9092 > /dev/null"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s
    restart: unless-stopped

volumes:
  patient-db-data:
  redpanda-data:
